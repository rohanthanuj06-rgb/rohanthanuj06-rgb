<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1200 430">

  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#02040e"/>
      <stop offset="48%" stop-color="#10152f"/>
      <stop offset="100%" stop-color="#08091b"/>
    </linearGradient>

    <radialGradient id="nebula">
      <stop offset="0%" stop-color="#a34dff" stop-opacity=".65"/>
      <stop offset="40%" stop-color="#5036c9" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#08091b" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueNebula">
      <stop offset="0%" stop-color="#39c6ff" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#10152f" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planet">
      <stop offset="0%" stop-color="#d4e7ff"/>
      <stop offset="35%" stop-color="#648bbf"/>
      <stop offset="75%" stop-color="#263b71"/>
      <stop offset="100%" stop-color="#080d24"/>
    </radialGradient>

    <radialGradient id="blackhole">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="48%" stop-color="#000"/>
      <stop offset="55%" stop-color="#5b35c9"/>
      <stop offset="65%" stop-color="#f4b8ff"/>
      <stop offset="72%" stop-color="#5c8fff"/>
      <stop offset="100%" stop-color="#17102f" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <linearGradient id="comet" x1="0" x2="1">
      <stop offset="0%" stop-color="#8ceaff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Deep space -->
  <rect width="1200" height="430" fill="url(#space)"/>

  <!-- Nebula clouds -->
  <ellipse cx="260" cy="170" rx="330" ry="190"
           fill="url(#nebula)" filter="url(#soft)">
    <animate attributeName="opacity"
             values=".55;.9;.55" dur="12s"
             repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="900" cy="300" rx="340" ry="180"
           fill="url(#blueNebula)" filter="url(#soft)">
    <animate attributeName="opacity"
             values=".5;.85;.5" dur="15s"
             repeatCount="indefinite"/>
  </ellipse>

  <!-- Distant galaxy -->
  <g transform="translate(850 110)" opacity=".65">
    <ellipse rx="115" ry="32" fill="none"
             stroke="#a5aaff" stroke-width="2"
             opacity=".5" transform="rotate(-25)"/>
    <ellipse rx="85" ry="22" fill="none"
             stroke="#d3aaff" stroke-width="4"
             opacity=".5" transform="rotate(-25)"/>
    <circle r="13" fill="#fff" filter="url(#glow)"/>
    <animateTransform attributeName="transform"
      type="rotate" from="0 850 110"
      to="360 850 110" dur="100s"
      repeatCount="indefinite"/>
  </g>

  <!-- Black hole -->
  <g transform="translate(1040 290)">
    <circle r="95" fill="url(#blackhole)" filter="url(#glow)"/>
    <ellipse rx="85" ry="22" fill="none"
             stroke="#b9a4ff" stroke-width="3"
             transform="rotate(-20)" opacity=".8"/>
    <ellipse rx="100" ry="28" fill="none"
             stroke="#ffb7f4" stroke-width="2"
             transform="rotate(-20)" opacity=".5"/>
    <circle r="35" fill="#02020a"/>
  </g>

  <!-- Planet -->
  <g transform="translate(180 300)">
    <circle r="57" fill="url(#planet)"/>
    <path d="M-50 -10 Q-10 -35 48 -8"
          fill="none" stroke="#d7eaff"
          opacity=".22" stroke-width="5"/>
    <ellipse rx="90" ry="17" fill="none"
             stroke="#a6c8ff" stroke-width="3"
             transform="rotate(-18)" opacity=".6"/>
    <ellipse rx="100" ry="19" fill="none"
             stroke="#ffffff" stroke-width="1"
             transform="rotate(-18)" opacity=".3"/>
  </g>

  <!-- Stars -->
  <g fill="#fff">
    <circle cx="60" cy="45" r="1.5"/>
    <circle cx="110" cy="180" r="1.2"/>
    <circle cx="220" cy="65" r="1.7"/>
    <circle cx="310" cy="320" r="1.4"/>
    <circle cx="400" cy="80" r="1.2"/>
    <circle cx="530" cy="40" r="1.5"/>
    <circle cx="650" cy="350" r="1.4"/>
    <circle cx="750" cy="55" r="1.5"/>
    <circle cx="920" cy="200" r="1.3"/>
    <circle cx="1130" cy="80" r="1.5"/>
    <circle cx="1150" cy="360" r="1.2"/>

    <circle cx="350" cy="130" r="2">
      <animate attributeName="opacity"
        values=".2;1;.2" dur="3s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="700" cy="190" r="2">
      <animate attributeName="opacity"
        values="1;.15;1" dur="4s"
        repeatCount="indefinite"/>
    </circle>

    <circle cx="970" cy="50" r="2">
      <animate attributeName="opacity"
        values=".1;1;.1" dur="5s"
        repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shooting comet -->
  <g>
    <path d="M0 0 L150 0" stroke="url(#comet)"
          stroke-width="3" stroke-linecap="round"/>
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M-150 120 L1300 -80"/>
  </g>

  <!-- Main title -->
  <g text-anchor="middle" font-family="Arial,sans-serif">
    <text x="600" y="185"
      fill="#ffffff" font-size="49"
      font-weight="bold" letter-spacing="8"
      filter="url(#glow)">
      ROHAN THANUJ
    </text>

    <text x="600" y="225"
      fill="#a9c8ff" font-size="17"
      letter-spacing="6">
      NIGHT SKY OBSERVATORY
    </text>

    <text x="600" y="260"
      fill="#d7d8ee" font-size="13"
      letter-spacing="3">
      SOFTWARE • ARTIFICIAL INTELLIGENCE • INNOVATION
    </text>
  </g>

  <!-- Animated orbital satellite -->
  <g>
    <circle cx="0" cy="0" r="5"
            fill="#ffffff" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="2" fill="#55dcff"/>
    <animateMotion dur="18s" repeatCount="indefinite"
      path="M600 70 A140 140 0 1 1 599.9 70"/>
  </g>

</svg>
