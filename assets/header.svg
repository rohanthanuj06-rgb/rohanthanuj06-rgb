<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#02040d"/>
      <stop offset=".5" stop-color="#10132d"/>
      <stop offset="1" stop-color="#030712"/>
    </linearGradient>

    <radialGradient id="purpleNebula">
      <stop stop-color="#b45cff" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#6237c7" stop-opacity=".3"/>
      <stop offset="1" stop-color="#080b20" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="blueNebula">
      <stop stop-color="#38caff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#080b20" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="planet">
      <stop stop-color="#d7ecff"/>
      <stop offset=".25" stop-color="#7199ce"/>
      <stop offset=".7" stop-color="#304b82"/>
      <stop offset="1" stop-color="#10182f"/>
    </radialGradient>

    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff1d6" stop-opacity=".1"/>
      <stop offset=".4" stop-color="#b6cfff"/>
      <stop offset=".7" stop-color="#d6aaff"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".1"/>
    </linearGradient>

    <linearGradient id="cometTrail">
      <stop stop-color="#83eaff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>

    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep-space background -->
  <rect width="1200" height="460" fill="url(#bg)"/>

  <!-- Distant nebulae -->
  <ellipse cx="260" cy="180" rx="340" ry="210"
           fill="url(#purpleNebula)" filter="url(#cloudBlur)">
    <animate attributeName="opacity"
             values=".55;.95;.55" dur="18s"
             repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="850" cy="350" rx="390" ry="190"
           fill="url(#blueNebula)" filter="url(#cloudBlur)">
    <animate attributeName="opacity"
             values=".45;.8;.45" dur="22s"
             repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="600" cy="50" rx="260" ry="110"
           fill="url(#purpleNebula)" filter="url(#cloudBlur)"
           opacity=".35"/>

  <!-- Distant stars -->
  <g fill="#fff">
    <circle cx="40" cy="40" r="1.5"/>
    <circle cx="105" cy="120" r="1"/>
    <circle cx="180" cy="35" r="1.5"/>
    <circle cx="250" cy="390" r="1.2"/>
    <circle cx="330" cy="80" r="1"/>
    <circle cx="420" cy="35" r="1.4"/>
    <circle cx="520" cy="390" r="1"/>
    <circle cx="650" cy="60" r="1.5"/>
    <circle cx="730" cy="400" r="1.3"/>
    <circle cx="820" cy="40" r="1"/>
    <circle cx="930" cy="170" r="1.4"/>
    <circle cx="1080" cy="80" r="1.3"/>
    <circle cx="1160" cy="390" r="1.5"/>
    <circle cx="1120" cy="230" r="1"/>
    <circle cx="75" cy="300" r="1.3"/>
  </g>

  <!-- Twinkling stars -->
  <g fill="#dceaff" filter="url(#glow)">
    <circle cx="150" cy="220" r="2">
      <animate attributeName="opacity"
               values=".15;1;.15" dur="3.2s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="385" cy="300" r="2">
      <animate attributeName="opacity"
               values="1;.2;1" dur="4.5s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="120" r="2">
      <animate attributeName="opacity"
               values=".2;1;.2" dur="2.8s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="970" cy="65" r="2">
      <animate attributeName="opacity"
               values="1;.2;1" dur="5s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="300" r="2">
      <animate attributeName="opacity"
               values=".2;1;.2" dur="3.8s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Distant spiral galaxy -->
  <g transform="translate(870 105)" opacity=".7">
    <ellipse rx="95" ry="27" fill="none"
             stroke="#b7a5ff" stroke-width="2"
             transform="rotate(-25)"/>
    <ellipse rx="68" ry="19" fill="none"
             stroke="#e5b8ff" stroke-width="3"
             transform="rotate(-25)" opacity=".7"/>
    <ellipse rx="38" ry="10" fill="none"
             stroke="#ffffff" stroke-width="2"
             transform="rotate(-25)" opacity=".8"/>
    <circle r="7" fill="#fff" filter="url(#strongGlow)"/>
    <animateTransform attributeName="transform"
      type="rotate" from="0 870 105"
      to="360 870 105" dur="100s"
      repeatCount="indefinite"/>
  </g>

  <!-- Ringed planet -->
  <g transform="translate(175 320)">
    <ellipse rx="115" ry="25" fill="none"
             stroke="url(#ring)" stroke-width="10"
             transform="rotate(-18)" opacity=".75"/>
    <circle r="65" fill="url(#planet)"/>
    <path d="M-50 -18 Q-10 -45 48 -20"
          stroke="#e1f1ff" stroke-width="5"
          opacity=".2" fill="none"/>
    <path d="M-48 20 Q0 0 52 22"
          stroke="#182d54" stroke-width="8"
          opacity=".5" fill="none"/>
    <ellipse rx="115" ry="25" fill="none"
             stroke="#d8e6ff" stroke-width="2"
             transform="rotate(-18)" opacity=".35"/>
  </g>

  <!-- Black hole and luminous accretion disk -->
  <g transform="translate(1040 310)">
    <ellipse rx="120" ry="37" fill="none"
             stroke="#9c69ff" stroke-width="18"
             opacity=".16" filter="url(#strongGlow)"
             transform="rotate(-17)"/>

    <ellipse rx="105" ry="29" fill="none"
             stroke="#ffb8ed" stroke-width="5"
             opacity=".9" filter="url(#glow)"
             transform="rotate(-17)"/>

    <ellipse rx="88" ry="22" fill="none"
             stroke="#83caff" stroke-width="3"
             opacity=".8" transform="rotate(-17)"/>

    <circle r="48" fill="#000008"/>
    <circle r="42" fill="#000" />
  </g>

  <!-- Moving comet -->
  <g>
    <path d="M-150 0 L0 0"
          stroke="url(#cometTrail)"
          stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3"
            fill="#fff" filter="url(#glow)"/>
    <animateMotion dur="9s" repeatCount="indefinite"
      path="M-180 130 L1350 -80"/>
  </g>

  <!-- Second small shooting star -->
  <g>
    <path d="M-80 0 L0 0"
          stroke="url(#cometTrail)" stroke-width="2"/>
    <circle r="2" fill="#fff"/>
    <animateMotion dur="13s" begin="3s"
      repeatCount="indefinite"
      path="M-100 340 L1300 170"/>
  </g>

  <!-- Central observatory typography -->
  <g text-anchor="middle" font-family="Arial, sans-serif">
    <text x="600" y="190"
          fill="#ffffff" font-size="52"
          font-weight="bold" letter-spacing="9"
          filter="url(#glow)">
      ROHAN THANUJ
    </text>

    <text x="600" y="232"
          fill="#b8c9ff" font-size="17"
          letter-spacing="7">
      NIGHT SKY OBSERVATORY
    </text>

    <path d="M400 255 H800"
          stroke="#8e9dff" stroke-width="1"
          opacity=".6"/>

    <text x="600" y="284"
          fill="#d9e7ff" font-size="13"
          letter-spacing="3">
      SOFTWARE  •  ARTIFICIAL INTELLIGENCE  •  INNOVATION
    </text>

    <text x="600" y="420"
          fill="#a7b6db" font-size="10"
          letter-spacing="4" opacity=".7">
      EXPLORING THE UNKNOWN, ONE LINE OF CODE AT A TIME
    </text>
  </g>

  <!-- Satellite moving around the observatory -->
  <g>
    <circle r="5" fill="#fff" filter="url(#glow)"/>
    <circle r="2" fill="#5ce6ff"/>
    <animateMotion dur="20s" repeatCount="indefinite"
      path="M600 40 A170 170 0 1 1 599.9 40"/>
  </g>
</svg>
